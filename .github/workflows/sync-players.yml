name: Sync Players Database to Supabase

on:
  schedule:
    # Executa toda segunda-feira às 06:00 UTC (03:00 BRT)
    - cron: "0 6 * * 1"
  workflow_dispatch: # Permite rodar manualmente na aba Actions do GitHub

jobs:
  sync-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Wikidata bulk sync directly to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/build-players.ts
          node scripts/seed-daily.ts
